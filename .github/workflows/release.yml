name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment (or keep the current manifest version)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest_version() {
            python3 -c "import json; print(json.load(open('custom_components/subzero_ble/manifest.json'))['version'])"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BUMP" != "current" ]; then
              VERSION=$(python3 scripts/bump_version.py "$BUMP")
              git add custom_components/subzero_ble/manifest.json
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Bump version to ${VERSION}"
              git push origin "HEAD:${REF_NAME}"
            else
              VERSION=$(manifest_version)
            fi
            TAG="v${VERSION}"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
            fi
            git push origin "$TAG"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            MANIFEST=$(manifest_version)
            if [ "$VERSION" != "$MANIFEST" ]; then
              echo "Tag $TAG does not match manifest.json version $MANIFEST"
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --generate-notes --title "$TAG" --verify-tag
