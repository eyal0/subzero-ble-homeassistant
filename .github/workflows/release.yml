name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment (or keep the current manifest version)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = "current" ]; then
            VERSION=$(python3 -c "import json; print(json.load(open('custom_components/subzero_ble/manifest.json'))['version'])")
          else
            VERSION=$(python3 scripts/bump_version.py "$BUMP")
            git add custom_components/subzero_ble/manifest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Bump version to ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin "HEAD:${{ github.ref_name }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --generate-notes --title "$TAG"
